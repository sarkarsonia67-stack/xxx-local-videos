<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="card"><h1>Upload Video</h1><div class="notice">Uploads are reviewed before publication. Do not upload illegal, non-consensual, exploitative, or under-18 content.</div><form id="f" enctype="multipart/form-data"><input name="title" placeholder="Video title" required><textarea name="description" placeholder="Description"></textarea><select name="category"><option>Other</option><option>Entertainment</option><option>Amateur</option><option>Education</option></select><input name="video" type="file" accept="video/mp4,video/webm,video/quicktime" required><button>Upload for Review</button></form><p id="m"></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/upload',{method:'POST',body:new FormData(f)}),j=await r.json();m.textContent=j.message||j.error;if(j.ok)f.reset()}</script></body></html>
