<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/style.css"></head><body><main><div class="card"><h1>Create Account</h1><form id="f"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><label><input id="age" type="checkbox" required style="width:auto"> I confirm I am 18+ and will upload only lawful, consensual content.</label><button>Register</button></form><p id="m"></p></div></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),j=await r.json();if(j.ok)location.href='/';else m.textContent=j.error}</script></body></html>
