<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fetcher Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f5f7fb;font-family:Arial}.wrap{max-width:1200px;margin:auto;padding:20px}.box,.stat,.table,.settings{background:#111925;border:1px solid #29354a;border-radius:16px}.login{max-width:420px;margin:12vh auto;padding:25px}.input{width:100%;padding:12px;margin:8px 0 13px;background:#0b111a;color:white;border:1px solid #2d394d;border-radius:10px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#6d61ff;color:white;font-weight:700}.ok{background:#15815c}.bad{background:#9b284a}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{padding:18px}.stat b{font-size:25px}.table{overflow:auto;margin:15px 0}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:11px;border-bottom:1px solid #29354a;text-align:left;font-size:13px}.pill{padding:5px 8px;border-radius:20px;font-size:11px}.pending{background:#4b3c13;color:#f0d06a}.approved{background:#103d2e;color:#6ce5b1}.rejected{background:#491b2b;color:#ff91aa}.settings{padding:18px;margin-top:20px}.settings textarea{width:100%;min-height:100px;background:#0b111a;color:#fff;border:1px solid #2d394d;border-radius:10px;padding:12px}.settings .input{margin-bottom:8px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<div id="login" class="box login"><h1>Fetcher Admin</h1><p>Video moderation dashboard</p><input class="input" id="pass" type="password" placeholder="Admin password"><button class="btn" style="width:100%" onclick="doLogin()">Login</button></div>
<div id="app" style="display:none"><div class="head"><h1>Admin Dashboard</h1><div><button class="btn" onclick="location.href='/'">Website</button> <button class="btn bad" onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="stat">Users<br><b id="usersCount">0</b></div><div class="stat">Pending<br><b id="pendingCount">0</b></div><div class="stat">Views<br><b id="viewsCount">0</b></div><div class="stat">Earning<br><b id="earnCount">₹0</b></div></div>
<h2>Video Publish Requests</h2><div class="table"><table><thead><tr><th>User</th><th>Title</th><th>Views</th><th>Status</th><th>Action</th></tr></thead><tbody id="videoRows"></tbody></table></div>
<h2>Bank Verification</h2><div class="table"><table><thead><tr><th>User</th><th>Account</th><th>IFSC</th><th>Status</th><th>Action</th></tr></thead><tbody id="bankRows"></tbody></table></div>
<h2>User Earnings / Transfer</h2><div class="table"><table><thead><tr><th>User</th><th>30 Days Views</th><th>Earning</th><th>Transfer</th></tr></thead><tbody id="earningRows"></tbody></table></div>
<div class="settings"><h2>Ads Settings</h2><textarea id="ads" placeholder="Approved ad network code / placement"></textarea><br><button class="btn" onclick="saveAds()">Save Ads</button><h2>Change Admin Password</h2><input class="input" id="newPass" type="password" placeholder="New password"><button class="btn" onclick="changePassword()">Change Password</button></div>
</div></div>
<script>
const DEFAULT="850931@";let adminPass=localStorage.getItem("fx_admin_pass")||DEFAULT;
let users=JSON.parse(localStorage.getItem("fx_users")||"[]"),videos=JSON.parse(localStorage.getItem("fx_videos")||"[]"),banks=JSON.parse(localStorage.getItem("fx_banks")||"[]");
function save(){localStorage.setItem("fx_users",JSON.stringify(users));localStorage.setItem("fx_videos",JSON.stringify(videos));localStorage.setItem("fx_banks",JSON.stringify(banks))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function doLogin(){if(pass.value!==adminPass)return alert("Wrong admin password");sessionStorage.setItem("fx_admin","1");openPanel()}
function openPanel(){if(sessionStorage.getItem("fx_admin")!=="1")return;login.style.display="none";app.style.display="block";render()}
function logout(){sessionStorage.removeItem("fx_admin");location.reload()}
function render(){usersCount.textContent=users.length;pendingCount.textContent=videos.filter(v=>v.status==="pending").length;viewsCount.textContent=videos.reduce((a,v)=>a+Number(v.views||0),0);earnCount.textContent="₹"+videos.reduce((a,v)=>a+Number(v.earning||0),0).toFixed(2);
videoRows.innerHTML=videos.map(v=>`<tr><td>${esc(v.userName)}</td><td>${esc(v.title)}</td><td>${v.views}</td><td><span class="pill ${v.status}">${v.status}</span></td><td>${v.status==="pending"?`<button class="btn ok" onclick="videoAction('${v.id}','approved')">Approve</button> <button class="btn bad" onclick="videoAction('${v.id}','rejected')">Reject</button>`:"—"}</td></tr>`).join("")||"<tr><td colspan=5>No requests</td></tr>";
bankRows.innerHTML=banks.map(b=>`<tr><td>${esc(b.userName)}</td><td>${esc(b.account)}</td><td>${esc(b.ifsc)}</td><td><span class="pill ${b.status}">${b.status}</span></td><td>${b.status==="pending"?`<button class="btn ok" onclick="bankAction('${b.userId}','approved')">Approve</button> <button class="btn bad" onclick="bankAction('${b.userId}','rejected')">Reject</button>`:"—"}</td></tr>`).join("")||"<tr><td colspan=5>No requests</td></tr>";
earningRows.innerHTML=users.map(u=>{let mine=videos.filter(v=>v.userId===u.id),views=mine.reduce((a,v)=>a+Number(v.views||0),0),earn=mine.reduce((a,v)=>a+Number(v.earning||0),0);return `<tr><td>${esc(u.name)}</td><td>${views}</td><td>₹${earn.toFixed(2)}</td><td><button class="btn" onclick="alert('Transfer action recorded for '+${JSON.stringify(u.name)})">Transfer</button></td></tr>`}).join("")||"<tr><td colspan=4>No users</td></tr>";
ads.value=localStorage.getItem("fx_ads")||""}
function videoAction(id,s){let v=videos.find(x=>x.id===id);if(v){v.status=s;save();render();alert(s==="approved"?"Video published live":"Video rejected")}}
function bankAction(uid,s){let b=banks.find(x=>x.userId===uid);if(b){b.status=s;save();render()}}
function saveAds(){localStorage.setItem("fx_ads",ads.value);alert("Ads settings saved")}
function changePassword(){if(newPass.value.length<6)return alert("Password must be 6+ characters");adminPass=newPass.value;localStorage.setItem("fx_admin_pass",adminPass);newPass.value="";alert("Admin password changed")}
openPanel();
</script></body></html>
