<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>18+ Video Platform</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #181818;
      border-bottom: 1px solid #333;
    }

    .topbar {
      max-width: 1200px;
      margin: auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #ff4d6d;
      text-decoration: none;
      white-space: nowrap;
    }

    .search {
      flex: 1;
      display: flex;
      gap: 8px;
    }

    .search input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: white;
      outline: none;
    }

    .search button {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    .age-warning {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 16px;
    }

    .warning-box {
      padding: 14px;
      background: #24171b;
      border: 1px solid #5a2935;
      border-radius: 10px;
      color: #ddd;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 18px 16px 50px;
    }

    .section-title {
      margin: 10px 0 18px;
      font-size: 22px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .video-card {
      background: #1b1b1b;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #292929;
      transition: transform .15s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
    }

    .video-preview {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    .video-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .duration-label {
      position: absolute;
      right: 7px;
      bottom: 7px;
      background: rgba(0,0,0,.8);
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 12px;
    }

    .adult-label {
      position: absolute;
      left: 7px;
      top: 7px;
      background: #e63946;
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }

    .video-info {
      padding: 12px;
    }

    .video-title {
      color: white;
      text-decoration: none;
      font-weight: bold;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hashtags {
      margin-top: 8px;
      color: #ff6b81;
      font-size: 13px;
      line-height: 1.5;
    }

    .meta {
      color: #aaa;
      font-size: 13px;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button,
    .watch-button {
      border: 0;
      border-radius: 7px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 13px;
    }

    .watch-button {
      background: #ff4d6d;
      color: white;
      text-decoration: none;
      flex: 1;
      text-align: center;
    }

    .share-button {
      background: #333;
      color: white;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #999;
      background: #191919;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    @media (max-width: 950px) {
      .video-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 700px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .topbar {
        flex-wrap: wrap;
      }

      .search {
        order: 3;
        flex-basis: 100%;
      }
    }

    @media (max-width: 430px) {
      .video-grid {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="topbar">

    <a class="logo" href="/">
      18+ Video
    </a>

    <div class="search">

      <input
        id="searchInput"
        type="search"
        placeholder="Search videos..."
      >

      <button onclick="searchVideos()">
        Search
      </button>

    </div>

  </div>

</header>

<div class="age-warning">

  <div class="warning-box">
    <strong>18+ Age-Gated Website</strong><br>
    This website is intended for adults only.
    Only lawful, consensual and age-appropriate
    content is permitted.
  </div>

</div>

<main>

  <h1 class="section-title">
    Latest Videos
  </h1>

  <div id="loading" class="loading">
    Loading videos...
  </div>

  <div
    id="videoGrid"
    class="video-grid"
  ></div>

</main>

<script>

let videos = [];


// ---------------------------------------------
// LOAD VIDEOS
// ---------------------------------------------

async function loadVideos(query = "") {

  const loading =
    document.getElementById("loading");

  const grid =
    document.getElementById("videoGrid");

  loading.style.display = "block";

  grid.innerHTML = "";

  try {

    const url =
      query
        ? "/api/videos?q=" +
          encodeURIComponent(query)
        : "/api/videos";

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error("Failed");
    }

    videos =
      await response.json();

    loading.style.display = "none";

    if (!videos.length) {

      grid.innerHTML = `
        <div class="empty">
          No videos found.
        </div>
      `;

      return;
    }

    videos.forEach(video => {

      grid.appendChild(
        createVideoCard(video)
      );

    });

  } catch (error) {

    console.error(error);

    loading.textContent =
      "Could not load videos.";

  }

}


// ---------------------------------------------
// CREATE VIDEO CARD
// ---------------------------------------------

function createVideoCard(video) {

  const card =
    document.createElement("article");

  card.className =
    "video-card";

  const hashtags =
    createHashtags(
      video.title,
      video.category
    );

  card.innerHTML = `

    <div class="video-preview">

      <video
        preload="metadata"
        src="/uploads/${encodeURIComponent(video.filename)}"
        muted
        playsinline
      ></video>

      <span class="adult-label">
        18+
      </span>

    </div>

    <div class="video-info">

      <a
        class="video-title"
        href="/watch/${video.id}"
      >
        ${escapeHTML(video.title)}
      </a>

      <div class="hashtags">
        ${hashtags}
      </div>

      <div class="meta">

        ${formatViews(video.views)}
        views

        •

        ${escapeHTML(video.category)}

      </div>

      <div class="actions">

        <a
          class="watch-button"
          href="/watch/${video.id}"
        >
          ▶ Watch
        </a>

        <button
          class="share-button"
          onclick="shareVideo(
            ${video.id},
            '${escapeJS(video.title)}'
          )"
        >
          ↗ Share
        </button>

      </div>

    </div>

  `;

  return card;
}


// ---------------------------------------------
// HASHTAGS
// ---------------------------------------------

function createHashtags(title, category) {

  const words =
    String(title)
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 3);

  const tags = [
    category,
    ...words
  ];

  return tags
    .map(tag =>
      "#" +
      String(tag)
        .replace(/[^a-zA-Z0-9]/g, "")
    )
    .filter(tag => tag.length > 1)
    .join(" ");
}


// ---------------------------------------------
// VIEWS
// ---------------------------------------------

function formatViews(number) {

  number =
    Number(number || 0);

  if (number >= 1000000) {
    return (
      (number / 1000000)
        .toFixed(1)
        .replace(".0", "") +
      "M"
    );
  }

  if (number >= 1000) {
    return (
      (number / 1000)
        .toFixed(1)
        .replace(".0", "") +
      "K"
    );
  }

  return number.toString();
}


// ---------------------------------------------
// SHARE
// ---------------------------------------------

async function shareVideo(id, title) {

  const url =
    window.location.origin +
    "/watch/" +
    id;

  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        title: title,
        text:
          "Watch this video",
        url: url
      });

    } catch (error) {
      console.log(error);
    }

    return;
  }

  try {

    await navigator.clipboard.writeText(url);

    alert(
      "Video link copied!"
    );

  } catch (error) {

    prompt(
      "Copy this video link:",
      url
    );

  }

}


// ---------------------------------------------
// SEARCH
// ---------------------------------------------

function searchVideos() {

  const input =
    document.getElementById(
      "searchInput"
    );

  loadVideos(
    input.value.trim()
  );

}


// ---------------------------------------------
// ENTER SEARCH
// ---------------------------------------------

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {
        searchVideos();
      }

    }
  );


// ---------------------------------------------
// SECURITY ESCAPE
// ---------------------------------------------

function escapeHTML(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(char) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];

      }
    );

}


function escapeJS(value) {

  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/\r/g, "\\r")
    .replace(/\n/g, "\\n");

}


// ---------------------------------------------
// START
// ---------------------------------------------

loadVideos();

</script>

</body>
</html>
