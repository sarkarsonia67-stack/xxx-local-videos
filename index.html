<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>18+ Video</title><link rel="stylesheet" href="/style.css"></head><body><nav><a class="brand" href="/">18+ Video</a><div class="navlinks"><a href="/upload.html">Upload</a><a href="/login.html">Login</a><a href="/register.html">Register</a></div></nav><main><section class="hero"><h1>18+ Video</h1><p>Watch approved videos</p></section><form class="search" id="search"><input name="q" placeholder="Search videos..."><button>Search</button></form><div id="grid" class="grid"></div></main><footer>Adults only. Illegal, non-consensual and exploitative content is prohibited.</footer><div class="agegate" id="agegate"><div class="agebox"><h1>18+ Only</h1><p>You must be at least 18 years old and agree to use this website lawfully.</p><div class="actions"><button id="enter">I am 18+</button><button class="secondary" id="leave">Leave</button></div></div></div><script>const gate=document.getElementById('agegate');if(localStorage.age18==='yes')gate.remove();document.getElementById('enter').onclick=()=>{localStorage.age18='yes';gate.remove()};document.getElementById('leave').onclick=()=>location.href='https://www.google.com';async function load(q=''){const r=await fetch('/api/videos?q='+encodeURIComponent(q));const vs=await r.json();document.getElementById('grid').innerHTML=vs.map(v=>`<article class="card video-card"><video muted preload="metadata" src="/uploads/${encodeURIComponent(v.filename)}"></video><a href="/watch/${v.id}"><h3>${esc(v.title)}</h3></a><div class="muted">${esc(v.category)} • ${v.views} views</div></article>`).join('')||'<p>No approved videos found.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('search').onsubmit=e=>{e.preventDefault();load(e.target.q.value)};load();</script></body></html>
